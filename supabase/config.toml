[functions.notificame-webhook]
verify_jwt = false

# notificame-templates: A PORTA de leitura dos templates HSM — o módulo _shared/notificame-templates.ts existia com 22 testes e NENHUM consumidor (nem edge function, nem hook), o que o tornava inalcançável pelo produto. SÓ LEITURA nesta fatia: criar/apagar submete à Meta e sai numa fatia própria, com o editor. JWT (requireAuth com requireOrganization) inside fn + flag `notificame` + whatsapp.manage_instances (a MESMA chave da tela de canais). NÃO exige isAdmin, ao contrário de channel-start: lá o retorno carrega a credencial da subconta, aqui carrega lista de templates aprovados. A instância vem por parâmetro do CLIENTE (`instance_id`, o uuid da NOSSA linha em whatsapp_instances — template é conceito de WhatsApp, e canal de WhatsApp NÃO mora em messaging_channels, que guarda os sociais) e é conferida contra a org em _shared/notificame-template-access.ts — o SELECT de propósito NÃO filtra por org, senão a guarda de tenancy ficaria inalcançável e nenhum teste a exercitaria. Falha do fornecedor vira 502, nunca 200 com lista vazia.
[functions.notificame-templates]
verify_jwt = false

# notificame-send-social: RESPONDER pelo Direct (Instagram/Facebook). Contrato confirmado em DUAS fontes do fornecedor (doc app.notificame.com.br + node oficial n8n): POST /v2/channels/{kind}/messages com {from,to,contents[]}. NÃO monta envelope nem grava a linha — delega ao NotificameProvider, que já persiste em channel_messages; reimplementar criaria uma segunda verdade sobre o formato. JWT (requireAuth com requireOrganization) inside fn + flag `notificame` + whatsapp.manage_instances. O canal vem por parâmetro do CLIENTE e é conferido em _shared/notificame-social-send.ts — aqui o gate é ESCRITA: canal alheio aceito manda mensagem pela conta de outro tenant. WhatsApp é RECUSADO por modelo (mora em whatsapp_instances e tem governor/janela/templates próprios). NÃO bloqueia por janela de 24h: a doc do fornecedor a declara, mas quem decide tentar é o operador — a tela mostra o tempo restante e a recusa sobe legível.
[functions.notificame-send-social]
verify_jwt = false

