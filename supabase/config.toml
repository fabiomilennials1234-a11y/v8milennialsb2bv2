# notificame: finaliza a conexão Seamless — lista canais COM O TOKEN DA SUBCONTA e vincula o canal novo (diff contra a baseline da sessão) à org do auth; registra a subscription de entrada (só Instagram) e CARIMBA o resultado em messaging_channels.inbound_subscription_* (colunas, não jsonb), SEM desfazer o vínculo quando falha — quem repara é notificame-subscription-repair. JWT (requireAuth) inside fn + gate de flag + whatsapp.manage_instances
[functions.notificame-channel-finish]
verify_jwt = false

# notificame-subscription-repair: O LEITOR do estado de recebimento. Cron de 5 min (pg_cron → pg_net, x-cron-secret fail-closed) que reencontra os canais status='connected' com inbound_subscription_status IN ('pending','failed') e retenta POST /v1/subscriptions com backoff exponencial (5min → 6h, sem estado terminal). Existe porque subscription_pending era produzido e NINGUÉM lia: o canal conectava, a tela dizia sucesso e nenhuma mensagem chegava. NÃO desregistra, NÃO desfaz vínculo, NÃO consulta feature flag (flag gateia conectar/mostrar, não receber).
[functions.notificame-subscription-repair]
verify_jwt = false

