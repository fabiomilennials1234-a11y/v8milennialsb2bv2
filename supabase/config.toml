# estático que nós escolhemos): caminho secreto na URL + token no header
# `asaas-access-token`, ambos em tempo constante, + allowlist de IP exigida só
# quando ASAAS_ENV=production (o Sandbox entrega de IPs fora da lista publicada).
# Responde SEMPRE 200 — erro devolvido pausa a fila do provedor e derruba o
# recebimento de toda a receita, não só daquele evento.
[functions.asaas-webhook]
