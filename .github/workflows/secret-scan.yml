name: Secret Scan

# Secret scanning with gitleaks. Fails the build when a credential is detected,
# so a leaked Supabase service_role JWT, an `sbp_` personal access token, or any
# generic high-entropy secret never reaches main/develop.
#
# Rules + allowlist live in .gitleaks.toml (repo root). Prove them locally:
#   bash scripts/test-secret-scan.sh

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Least-privilege. gitleaks only reads the checkout.
permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so PRs are scanned across their whole commit range,
          # not just the tip. A secret added and "removed" in the same PR is
          # still in history and must be caught.
          fetch-depth: 0

      - name: Run gitleaks
        # Pinned action release. GITLEAKS_CONFIG points at our committed config.
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: ${{ github.workspace }}/.gitleaks.toml
          # Surface findings in the job summary; exit non-zero on any leak.
          GITLEAKS_ENABLE_SUMMARY: 'true'

  # Verifies the .gitleaks.toml rules still fire (plants fake secrets in a
  # scratch dir, then cleans up) and that every workflow YAML is well-formed.
  # If a refactor weakens a rule, this job goes red before a real leak slips by.
  ruleset-selftest:
    name: gitleaks ruleset self-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install gitleaks
        run: |
          version="8.30.1"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run secret-scan self-test
        run: npm run test:secrets
