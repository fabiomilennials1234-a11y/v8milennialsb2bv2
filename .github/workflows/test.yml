name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    # `develop` entrou em 2026-08-11. Antes disso, PR com base develop não
    # rodava NADA daqui — nem typecheck, nem build, nem vitest, nem os pgTAP
    # de invariante de RLS. Os gates só disparavam no push do merge, ou seja
    # DEPOIS de o código já estar em develop, quando reprovar custa reverter.
    #
    # Os outros workflows com pull_request (codeql, secret-scan,
    # vault-sentinel) já listavam os dois branches; este era o único fora do
    # padrão, o que fazia o PR parecer verde com dois checks passando.
    branches: [main, develop]

jobs:
  quality:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 porque o guarda de colisão de migration compara a branch
      # contra `origin/main` (metade (b), issue #1534). No clone raso o ref da
      # base não existe, o guarda avisa e PULA essa metade — e meia guarda que
      # passa em silêncio é o defeito que ela existe para pegar.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Security audit
        run: npm audit --audit-level=high
        continue-on-error: true
      # ESLint ratchet, não `npm run lint` cru: o repo tem 0 errors e ~29k
      # warnings herdados. O comando cru sai 0 mas imprime 29.142 linhas
      # terminadas em "✖ 29142 problems" — que subagente do harness lia como
      # vermelho, recusando o fan-out por dívida que a branch não criou.
      # O ratchet reprova só o INTRODUZIDO (errors e warnings) e imprime o
      # herdado como informativo, com teto de 20 linhas.
      - name: ESLint ratchet (no new lint problems vs baseline)
        run: npm run lint:ratchet
      - name: Dep-cruise ratchet (no new violations vs baseline)
        run: npm run lint:deps:check
      - name: Migration version guard — self-test (red + negative control)
        run: bash scripts/check-migration-versions.test.sh
      - name: Migration version guard (no duplicates here, none colliding with the base)
        # A base tem que ser AQUELA EM QUE O PR VAI ENTRAR, não `main` sempre.
        #
        # Sem esta linha o script cai no default `origin/main`, e aí TODO PR que
        # mira `develop` é comparado com main. Como develop legitimamente carrega
        # migrations que main não tem, vira falso positivo por construção.
        #
        # Medido em 2026-08-21: o PR #1712 reprovou aqui por `20270730000010`,
        # que em develop é `deals_rls_org_scope` e em main é `voip_webhook_ingest`
        # — porque o renumber da PR #1430 (SCRUM-244) só chegou em develop. Nada
        # estava errado no PR; a base é que era.
        #
        # `github.base_ref` só existe em pull_request. No push (main/develop) ele
        # vem vazio e o default do script volta a valer — que é o certo: num push
        # para develop, comparar com main é exatamente a pergunta útil.
        env:
          MIGRATION_BASE_REF: ${{ github.base_ref && format('origin/{0}', github.base_ref) || '' }}
        run: bash scripts/check-migration-versions.sh
      - name: Metric anti-pattern lint (ADR-0017 — no new metric root causes)
        run: bash scripts/check-metric-antipatterns.sh
      # ADR-0024 §4: só o governor assina credencial de chamada. Nem o
      # dependency-cruiser (exclui ^supabase/) nem o ESLint boundaries
      # (include: src/**) enxergam supabase/functions — a barreira é este script.
      - uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x
      # `deno task test` roda com `--no-check`: nada em `_shared/` passava por
      # compilador. Custou dois `TS2339` vivos por meses sobre
      # `crypto.subtle.timingSafeEqual` (função que não existe no Deno 2) no
      # verificador de assinatura do `meta-webhook`, um `generateEmbedding`
      # inexistente que deixava o RAG do copilot mudo, e uma ação de copilot
      # chamada sem `tenantId`. Nenhum teste pegava: os três falham para dentro
      # de um `catch`. Bloqueante de propósito — portão amarelo ninguém olha.
      #
      # Escopo = `_shared/`, e só. `deno check` já arrasta o grafo importado por
      # esses arquivos, então a camada compartilhada fica coberta inteira. As 96
      # funções em si NÃO entram: carregam dívida própria (medido em 2026-08-02:
      # 106 erros só em 4 delas), e portão que nasce vermelho é portão que alguém
      # desliga na primeira sexta-feira.
      - name: Type-check shared edge modules (deno check _shared/)
        run: npm run typecheck:edge-shared
      - name: VoIP choke barrier (só o governor assina)
        run: bash scripts/test-voip-choke.sh
      - name: TSC ratchet (no new type errors vs baseline)
        run: npm run typecheck:ratchet
      - name: Build (prod)
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          VITE_CALENDAR_SERVICE_URL: ${{ secrets.VITE_CALENDAR_SERVICE_URL }}
          VITE_INVITE_API_URL: ${{ secrets.VITE_INVITE_API_URL }}
          VITE_META_APP_ID: ${{ secrets.VITE_META_APP_ID }}

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      # Ratchet, e não `npm run test:unit` cru: medido em 2026-08-05 na
      # develop, a suíte tem 178 vermelhos herdados de 7.718 — o job reprovava
      # em toda execução, e portão que nasce vermelho ninguém lê. A dívida não
      # é regressão de feature nenhuma: o CI rodava só `tests/unit/` e, quando
      # passou a incluir `src/` (#1041), apareceram os arquivos co-locados que
      # nunca tinham sido executados.
      #
      # O ratchet reprova só o que ESTA branch quebrou, e avisa quando um teste
      # do baseline volta a passar — para o teto encolher em vez de virar
      # decoração. Mesma forma de `lint:ratchet` e `typecheck:ratchet`.
      - name: Vitest ratchet (no newly broken tests vs baseline)
        run: npm run test:ratchet
      # Os thresholds de coverage em vitest.config.ts SERIAM o portão de
      # regressão — mas hoje não são: `vitest run --coverage` sai != 0 por
      # teste vermelho antes de chegar a avaliar cobertura, e são 137 dos 178
      # herdados dentro de `tests/unit/` (medido 2026-08-05). O passo reprovava
      # sempre, pelo mesmo motivo que o de cima.
      #
      # Fica informativo ATÉ o baseline do ratchet encolher — o relatório
      # continua sendo publicado como artefato, que é o que serve para decidir
      # onde escrever teste. Voltar a ser bloqueante é uma linha: apagar o
      # `continue-on-error`. Não faça isso antes de `.vitest-baseline.json`
      # chegar a zero, ou o portão volta a nascer vermelho.
      - run: npm run test:coverage
        continue-on-error: true
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage
          path: coverage/
          retention-days: 14

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:integration
        env:
          SUPABASE_URL: http://localhost:54321
          SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU

  rls-invariants:
    name: RLS Invariants (pgTAP)
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # Boots local Postgres and applies supabase/migrations/* — the clean
      # schema the invariant suite asserts against.
      - run: supabase start
      - name: Install pgTAP TAP harness (pg_prove)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libtap-parser-sourcehandler-pgtap-perl postgresql-client
      - name: Run RLS invariant suite (red fixture + clean gate)
        run: bash supabase/tests/run.sh
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      - name: Seed test database
        run: PGPASSWORD=postgres psql -h localhost -p 54322 -U postgres -d postgres -f supabase/seed.sql
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npm run build
        env:
          VITE_SUPABASE_URL: http://localhost:54321
          VITE_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
          VITE_SUPABASE_PROJECT_ID: local
      - name: Create playwright auth dir
        run: mkdir -p .playwright-auth
      - run: npx playwright test
        env:
          SUPABASE_URL: http://localhost:54321
          VITE_SUPABASE_URL: http://localhost:54321
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
          VITE_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
          E2E_USER_EMAIL: admin@test.com
          E2E_USER_PASSWORD: Test123!@#
      - name: Upload E2E artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  edge-function-tests:
    name: Edge Function Tests (Deno)
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # Deno 2. O `supabase/functions/deno.lock` está na versão 5 do formato, que
      # só o Deno 2 lê — o 1.46.3 morre com "Unsupported lockfile version '5'"
      # antes de rodar um teste sequer. A main já corrigiu isto no a9b99c7e; a
      # develop não recebeu, e ninguém viu porque o job vinha `skipped` atrás do
      # `needs: [quality]` vermelho.
      - uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x
      - run: npm run test:edge
      - run: npm run test:edge:coverage
      - name: Upload edge coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edge-coverage
          path: supabase/functions/coverage.lcov
          retention-days: 14

  workflow-tests:
    name: Workflow System Tests
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v4
      - name: Guard do alvo remoto — self-test (pula sem secret, recusa prod)
        run: bash scripts/test-workflows.guard.test.sh
      # Os dois secrets NÃO estão cadastrados no repositório, e por isso este job
      # ficou vermelho desde sempre com "SUPABASE_SERVICE_ROLE_KEY is required"
      # (SCRUM-364) — vermelho de secret ausente, lido por meses como defeito de
      # código. Agora o script PULA em voz alta, e diz no resumo do job que verde
      # aqui significa "não rodou".
      #
      # Quando forem cadastrados, o valor tem que ser o de uma BRANCH EFÊMERA.
      # O nome `_DEV` é histórico: o projeto dev foi APOSENTADO em 2026-07-22 e o
      # script recusa tanto o ref dele quanto o de produção.
      - name: Run workflow system tests
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_DEV }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_DEV }}
        run: bash scripts/test-workflows.sh
