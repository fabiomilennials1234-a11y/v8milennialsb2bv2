name: Build Image

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            VITE_SUPABASE_PUBLISHABLE_KEY=${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
            VITE_SUPABASE_PROJECT_ID=${{ secrets.VITE_SUPABASE_PROJECT_ID }}
            VITE_CALENDAR_SERVICE_URL=${{ secrets.VITE_CALENDAR_SERVICE_URL }}
            VITE_INVITE_API_URL=${{ secrets.VITE_INVITE_API_URL }}
            VITE_META_APP_ID=${{ secrets.VITE_META_APP_ID }}
            VITE_META_WA_CONFIG_ID=${{ secrets.VITE_META_WA_CONFIG_ID }}
            VITE_APP_VERSION=sha-${{ github.sha }}

      # Deploy is intentionally decoupled from main. Push to main only builds
      # and publishes the image to ghcr.io as :latest + :sha-<short>. To ship
      # to production, trigger a redeploy manually in the EasyPanel UI (it
      # pulls :latest from ghcr.io). This avoids surprise prod pushes from
      # routine merges.
