name: Cafe Jurere leads tabs regression
on:
  pull_request:
    paths:
      - '.github/workflows/cafe-jurere-leads-tabs.yml'
      - 'scripts/test-cafe-jurere-leads-tabs.mjs'
      - 'supabase/migrations/*leads_cafe_jurere_cadastro_erp.sql'
      - 'supabase/migrations/*leads_cafe_jurere_visibilidade.sql'
      - 'supabase/migrations/*cafe_jurere_visibility_cache.sql'
permissions:
  contents: read
jobs:
  sql:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test classification and tenant isolation
        run: |
          npm install --prefix "$RUNNER_TEMP/cafe-jurere" @electric-sql/pglite@0.3.14 --no-audit --no-fund
          PGLITE_MODULE="file://$RUNNER_TEMP/cafe-jurere/node_modules/@electric-sql/pglite/dist/index.js" node scripts/test-cafe-jurere-leads-tabs.mjs
