services:
  quote-documents:
    build: .
    restart: unless-stopped
    environment:
      QUOTE_DOCUMENT_TOKEN: ${QUOTE_DOCUMENT_TOKEN:?Set a secret of at least 32 characters}
      SOFFICE_PATH: /usr/bin/soffice
      HOME: /tmp
    read_only: true
    tmpfs:
      - /tmp:size=268435456,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 768m
    cpus: 1.0
    # Only a local TLS reverse proxy should expose this authenticated service.
    ports: ["127.0.0.1:8096:8080"]
    networks: [documents]
networks:
  documents:
    internal: true
