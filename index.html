    <!-- Security Headers -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-XSS-Protection" content="1; mode=block" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    
    <!-- Content Security Policy - Ajuste os domínios conforme necessário -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' 'unsafe-inline' 'unsafe-eval' https://connect.facebook.net;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com;
      font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com;
      img-src 'self' data: https: blob:;
      media-src 'self' blob: https:;
      connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.supabase.in https://graph.facebook.com https://www.facebook.com https://fonts.googleapis.com https://calls.torquecrm.com.br https://*.sentry.io;
      worker-src 'self' blob:;
      frame-src 'self' https://www.facebook.com https://web.facebook.com https://staticxx.facebook.com https://connect.facebook.net;
      base-uri 'self';
      form-action 'self';
    " />

    <meta property="og:site_name" content="Torque CRM" />
    <meta property="og:title" content="Torque CRM" />
    <meta property="og:description" content="CRM B2B para fábricas e distribuidoras: funil de vendas, WhatsApp, campanhas e automações com IA." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://torquecrm.com.br/og-image.png" />

    <!--
      Identidade da marca para buscadores. Existe outro produto chamado
      "Torque CRM" (torquecrm.online, CRM de oficina); sem estes dados o Google
      funde os dois na Visão geral criada por IA. Organization + WebSite fixam
      nome do site, logo e entidade legal; o @id liga os três nós.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://torquecrm.com.br/#organization",
            "name": "Torque CRM",
            "alternateName": "Torque",
            "url": "https://torquecrm.com.br/",
            "logo": {
              "@type": "ImageObject",
              "url": "https://torquecrm.com.br/pwa-512x512.png",
              "width": 512,
              "height": 512
            },
            "image": "https://torquecrm.com.br/og-image.png",
            "description": "Plataforma SaaS de CRM para empresas B2B — fábricas e distribuidoras.",
            "email": "acesso@torquecrm.com.br",
            "taxID": "54.384.269/0001-48",
            "areaServed": "BR"
          },
          {
            "@type": "WebSite",
            "@id": "https://torquecrm.com.br/#website",
            "name": "Torque CRM",
            "alternateName": ["Torque", "torquecrm.com.br"],
            "url": "https://torquecrm.com.br/",
            "inLanguage": "pt-BR",
            "publisher": { "@id": "https://torquecrm.com.br/#organization" }
          },
          {
            "@type": "SoftwareApplication",
            "@id": "https://torquecrm.com.br/#software",
            "name": "Torque CRM",
            "url": "https://torquecrm.com.br/",
            "applicationCategory": "BusinessApplication",
            "applicationSubCategory": "CRM B2B",
            "operatingSystem": "Web",
            "inLanguage": "pt-BR",
            "description": "CRM B2B para fábricas e distribuidoras: funil de vendas, WhatsApp, campanhas e automações com inteligência artificial.",
            "image": "https://torquecrm.com.br/og-image.png",
            "publisher": { "@id": "https://torquecrm.com.br/#organization" }
          }
        ]
      }
    </script>
    <script>
      (function() {
        var theme = localStorage.getItem("torque-theme") || localStorage.getItem("v8-theme");
        var isDark = theme === "dark" || (theme === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (isDark) document.documentElement.classList.add("dark");
        else document.documentElement.classList.remove("dark");
      })();
    </script>
  </head>

  <body>
    <!--
      Crawlers de IA (GPTBot, ClaudeBot, PerplexityBot) não executam JS: sem
      isto, a home é um <div> vazio para eles. Fica fora do #root, então o
      React nunca o toca; browser com JS não renderiza <noscript>.
    -->
    <noscript>
      <main>
        <h1>Torque CRM — o CRM B2B para fábricas e distribuidoras</h1>
        <p>
          Torque CRM é uma plataforma SaaS brasileira de gestão comercial para empresas que vendem
          para outras empresas: funis de venda em kanban, automação de follow-ups e tarefas,
          distribuição de leads, reativação de carteira, WhatsApp e outros canais, agentes de IA com
          supervisão humana e painéis de desempenho do time. Planos a partir de R$ 297 por mês.
        </p>
        <ul>
          <li><a href="/sobre">Sobre o Torque CRM</a></li>
          <li><a href="/lp/v1/">Conheça o produto e agende uma demonstração</a></li>
          <li><a href="/llms.txt">Resumo para assistentes de IA</a></li>
          <li><a href="/termos">Termos de Serviço</a> · <a href="/privacidade">Privacidade</a></li>
        </ul>
        <p>Para usar a plataforma, ative o JavaScript no navegador.</p>
      </main>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
