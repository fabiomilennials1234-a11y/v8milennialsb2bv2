  <symbol id="i-whats" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a9.9 9.9 0 0 0-8.5 15L2 22l5.2-1.4A9.9 9.9 0 1 0 12 2Zm5.6 14.1c-.2.7-1.2 1.3-1.9 1.4-.5.1-1.2.2-3.5-.7-2.9-1.2-4.8-4.2-5-4.4-.1-.2-1.1-1.5-1.1-2.9s.7-2 1-2.3c.2-.3.5-.4.7-.4h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.4.5-.3.3c-.1.1-.2.3-.1.5.1.2.6 1.1 1.4 1.8 1 .9 1.8 1.2 2 1.3.2.1.4.1.5-.1l.7-.9c.2-.2.3-.2.5-.1l2 .9c.2.1.4.2.4.3.1.2.1.7-.1 1.3Z"/></symbol>

<div class="app">

  <!-- Top nav do Torque -->
  <nav class="tn">
    <!-- Logo real do produto: src/assets/torque-icon.png + wordmark no hover,
         mesma mecânica do TopNavigation.tsx (gira 360° e ganha brilho dourado). -->
    <a class="tn-logo" href="#" title="Central de Comando" aria-label="Torque — Central de Comando">
      <img class="tn-ic" src="torque-icon.png" alt="Torque" width="32" height="32">
      <span class="tn-word"><img src="torque-logo.png" alt="" aria-hidden="true"></span>
    </a>
    <button class="tn-item" type="button">Comando</button>
    <button class="tn-item" type="button">Chat</button>
    <button class="tn-item" type="button">Disparos</button>
    <button class="tn-item on" type="button" aria-current="page">Funis</button>
    <button class="tn-item" type="button">Carteira</button>
    <button class="tn-item" type="button">Agenda</button>
    <button class="tn-item" type="button">Ranking</button>
    <button class="tn-item" type="button">Mais</button>
    <span class="tn-right"><span class="tn-av">LM</span></span>
  </nav>

  <!-- Modelo 1 — faixa única de controles -->
  <div class="bar">
    <div class="pop-wrap">
      <button class="pick" id="btn-pick" type="button" title="Trocar de funil"
              aria-haspopup="listbox" aria-expanded="false" aria-controls="menu-funis">
        <span class="sw" id="pick-sw" style="background:#3b82f6"></span>
        <span id="pick-nome">Qualificação</span>
        <svg class="ic"><use href="#i-chev"/></svg>
      </button>
      <div class="menu menu--funis" id="menu-funis" role="listbox" aria-label="Escolher funil" hidden></div>
    </div>

    <span class="spacer"></span>

    <label class="srch">
      <svg><use href="#i-search"/></svg>
      <input id="busca" type="search" placeholder="Buscar lead, empresa, telefone…" aria-label="Buscar">
    </label>

    <div class="pop-wrap">
      <button class="ctl" id="btn-views" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="menu-views">
        <svg id="ic-vista"><use href="#i-kanban"/></svg> Views
      </button>
      <div class="menu menu--views" id="menu-views" role="menu" aria-label="Visualizações salvas" hidden></div>
    </div>

    <div class="pop-wrap">
      <button class="ctl" id="btn-filtros" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="menu-filtros">
        <svg><use href="#i-filter"/></svg> Filtros <span class="cnt" id="cnt-filtros" hidden>0</span>
      </button>
      <div class="menu menu--filtros" id="menu-filtros" role="dialog" aria-label="Filtros" hidden></div>
    </div>

    <button class="ctl" id="btn-cfg" type="button"><svg><use href="#i-gear"/></svg> Configurações</button>
    <button class="ctl ctl--gold" type="button"><svg><use href="#i-plus"/></svg> Novo negócio</button>
  </div>

  <div class="chips-bar" id="chips" hidden></div>

  <div class="board" id="board"></div>

  <div class="vazio-geral" id="vazio-geral" hidden>
    <svg><use href="#i-search"/></svg>
    <p>Nenhum negócio com esses filtros.</p>
  </div>

  <!-- Barra de ação em massa — só aparece com algo selecionado -->
  <div class="selbar" id="selbar" hidden role="toolbar" aria-label="Ações em massa"></div>
</div>

<!-- ═══════════════ Ficha do lead — estrutura do LeadDetailDialogV2 ═══════════════
     Desktop não tem abas: grid 7/5. Esquerda = CrossPipePanel + Info,
     direita = Checklist + Histórico & comentários. -->
<div class="ov" id="ov-ficha" hidden role="dialog" aria-modal="true" aria-labelledby="f-nome">
  <div class="sheet sheet--ficha">

    <!-- A. Header (LeadModalHeader) -->
    <div class="lm-head">
      <div class="lm-id">
        <span class="lm-av" id="f-av"></span>
        <div class="lm-id-txt">
          <h2 class="lm-nome" id="f-nome"></h2>
          <div class="lm-meta" id="f-meta"></div>
        </div>
      </div>

      <div class="lm-slots">
        <div class="slot-grp">
          <div class="slot-t">Responsáveis</div>
          <div class="slots" id="f-resp"></div>
        </div>
        <div class="slot-grp">
          <div class="slot-t">Qualificação</div>
          <div class="slots" id="f-qual"></div>
        </div>
      </div>

      <button class="sh-x" data-fechar type="button" aria-label="Fechar"><svg><use href="#i-x"/></svg></button>
    </div>

    <div class="lm-tags" id="f-tags"></div>

    <!-- B. Toolbar (LeadModalToolbar) -->
    <div class="lm-tools">
      <button class="tool" type="button"><svg><use href="#i-whats"/></svg> WhatsApp</button>
      <button class="tool" type="button"><svg><use href="#i-fone"/></svg> Ligar</button>
      <button class="tool" type="button"><svg><use href="#i-mail"/></svg> Email</button>
      <button class="tool" type="button"><svg><use href="#i-clock"/></svg> Follow-up</button>
      <span class="tool-ia">
        <span class="sw-t sw-t--mini" role="switch" aria-checked="true" aria-label="IA ativa"></span> IA
      </span>
      <button class="tool tool--kb" type="button" aria-label="Mais ações"><svg><use href="#i-dots"/></svg></button>
    </div>

    <!-- C. Corpo -->
    <div class="lm-body">
      <div class="lm-left">
        <section id="f-pipes"></section>
        <section id="f-info"></section>
      </div>
      <div class="lm-right">
        <section id="f-check"></section>
        <section id="f-hist"></section>
      </div>
    </div>
  </div>
</div>

<!-- ═══════════════ Configurações do funil ═══════════════ -->
<div class="ov" id="ov-cfg" hidden role="dialog" aria-modal="true" aria-labelledby="c-nome">
  <div class="sheet sheet--cfg">

    <div class="sh-head">
      <div>
        <div class="sh-title" id="c-nome">Configurações</div>
        <div class="sh-sub" id="c-tipo"></div>
      </div>
      <button class="sh-x" data-fechar type="button" aria-label="Fechar"><svg><use href="#i-x"/></svg></button>
    </div>

    <div class="cfg-tabs" id="c-tabs" role="tablist"></div>

    <div class="cfg-body" id="c-body"></div>

    <div class="sh-foot">
      <span class="nota-rodape">Protótipo: as mudanças valem só nesta aba do navegador.</span>
      <button class="ctl" data-fechar type="button">Fechar</button>
      <button class="ctl ctl--gold" data-fechar type="button"><svg><use href="#i-check"/></svg> Salvar</button>
    </div>
  </div>
</div>

<datalist id="catalogo">
  <option value="Compressor parafuso 50L"></option>
  <option value="Compressor pistão 20L"></option>
  <option value="Manutenção preventiva"></option>
  <option value="Contrato de suporte"></option>
  <option value="Instalação e setup"></option>
  <option value="Treinamento de operação"></option>
  <option value="Kit de filtros (12 un)"></option>
  <option value="Mangueira alta pressão 10m"></option>
</datalist>

<div class="proto"><b>Protótipo</b> · dados fictícios · não fala com o Torque</div>

<script type="module" src="app.js"></script>
</body>
</html>
